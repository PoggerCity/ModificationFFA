name: ModificationFFA
description: A free-for-all plugin.
version: '${version}'

main: me.poggercity.modificationFFA.ModificationFFA
api-version: '1.21.11'
load: POSTWORLD
loadbefore: [PlayerKits2]

authors: [PoggerCity]

commands:
  modification:
    description: Shows information about ModificationFFA.
    usage: /modification
    aliases: [modificationffa]
  discord:
    description: Shows the server Discord link.
    usage: /discord
  store:
    description: Shows the server store link.
    usage: /store
  kit:
    description: Loads and manages your ModificationFFA kit layout.
    usage: /kit help
  bin:
    description: Opens the Modification Bin.
    usage: /bin
    aliases: [trash]
  clear:
    description: Clears your inventory.
    usage: /clear [player]
    permission: modificationffa.clear
  find:
    description: Finds an online player and their current biome region.
    usage: /find <player>
    aliases: [locate]
  ping:
    description: Shows your ping or another player's ping.
    usage: /ping [player]
  stats:
    description: Shows your combat and item statistics.
    usage: /stats [player]
  biome:
    description: Creates and manages custom biome regions.
    usage: /biome help
    permission: modificationffa.biome.admin
  executioner:
    description: Opens the Executioner Trader.
    usage: /executioner
  tokens:
    description: Manages ModificationFFA tokens.
    usage: /tokens give <player> <type> <amount>
    permission: modificationffa.tokens.admin
  woodtoken:
    description: Creates regenerating wood-token nodes.
    usage: /woodtoken give <player> <wood_type>
    permission: modificationffa.tokens.admin
  miningtoken:
    description: Creates regenerating mining-token nodes.
    usage: /miningtoken give <player> <ore_type>
    permission: modificationffa.tokens.admin

permissions:
  modificationffa.reload:
    description: Allows reloading ModificationFFA's configuration.
    default: op
  modificationffa.cooldown.bypass:
    description: Bypasses the shared /discord and /store cooldown.
    default: op
  modificationffa.kit.admin:
    description: Allows saving the authoritative main kit.
    default: op
  modificationffa.clear:
    description: Allows clearing your own inventory.
    default: true
  modificationffa.clear.others:
    description: Allows clearing another online player's inventory.
    default: op
  modificationffa.biome.admin:
    description: Allows creating and deleting custom biome regions.
    default: op
  modificationffa.tokens.admin:
    description: Allows giving tokens and regenerating resource nodes.
    default: op
