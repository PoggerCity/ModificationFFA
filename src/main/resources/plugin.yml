name: ModificationFFA
description: A free-for-all plugin.
version: '${version}'

main: me.poggercity.modificationFFA.ModificationFFA
api-version: '1.21.11'
load: POSTWORLD
loadbefore: [PlayerKits2]

authors: [PoggerCity]

commands:
  discord:
    description: Shows the server Discord link.
    usage: /discord
  store:
    description: Shows the server store link.
    usage: /store
  kit:
    description: Loads and manages your ModificationFFA kit layout.
    usage: /kit help
  bin:
    description: Opens the Modification Bin.
    usage: /bin
    aliases: [trash]
  merge:
    description: Opens the Punch Bow Merger.
    usage: /merge
  settings:
    description: Opens your Modification Settings.
    usage: /settings
  clear:
    description: Clears your inventory.
    usage: /clear [player]
  find:
    description: Finds an online player and their current biome region.
    usage: /find <player>
    aliases: [locate]
  ping:
    description: Shows your ping or another player's ping.
    usage: /ping [player]
  stats:
    description: Shows your combat and item statistics.
    usage: /stats [player]
  biome:
    description: Creates and manages custom biome regions.
    usage: /biome help
  executioner:
    description: Opens the Executioner Trader.
    usage: /executioner
    aliases: [execuitoner]
  tokens:
    description: Manages ModificationFFA tokens.
    usage: /tokens give <player> <type> <amount>
  woodtoken:
    description: Creates regenerating wood-token nodes.
    usage: /woodtoken give <player> <wood_type>
  miningtoken:
    description: Creates regenerating mining-token nodes.
    usage: /miningtoken give <player> <ore_type>
  spawn:
    description: Teleports you to the server spawn after five seconds.
    usage: /spawn
  setspawn:
    description: Sets the server spawn.
    usage: /setspawn
  combat:
    description: Shows and manages combat tags.
    usage: /combat [help|timer|tag|untag]
  msg:
    description: Sends a private message.
    usage: /msg <player> <message>
    aliases: [message, m, whisper, w, tell, pm]
  reply:
    description: Replies to your latest private message.
    usage: /reply <message>
    aliases: [r, apprend]
  continue:
    description: Continues your current private conversation.
    usage: /continue <message>
    aliases: [c, a]
  sword:
    description: Shows and uses Modification sword abilities.
    usage: /sword help
  pet:
    description: Spawns and manages your cosmetic pet.
    usage: /pet help
  arena:
    description: Creates and configures gameplay arenas.
    usage: /arena help
  protectarena:
    description: Creates protected build arenas and exemptions.
    usage: /protectarena help

permissions:
  modificationffa.reload:
    description: Allows reloading ModificationFFA's configuration.
    default: op
  modificationffa.cooldown.bypass:
    description: Bypasses the shared /discord and /store cooldown.
    default: op
  modificationffa.kit.admin:
    description: Allows saving the authoritative main kit.
    default: op
  modificationffa.clear:
    description: Allows clearing your own inventory.
    default: true
  modificationffa.clear.others:
    description: Allows clearing another online player's inventory.
    default: op
  modificationffa.biome.admin:
    description: Allows creating and deleting custom biome regions.
    default: op
  modificationffa.tokens.admin:
    description: Allows giving tokens and regenerating resource nodes.
    default: op
  modificationffa.spawn.set:
    description: Allows setting the server spawn.
    default: op
  modificationffa.command.combat.tag:
    description: Allows force-tagging a player for combat.
    default: op
  modificationffa.command.combat.untag:
    description: Allows removing a player's combat tag.
    default: op
  modificationffa.command.combat.commandwhitelist:
    description: Allows configuring commands available during combat.
    default: op
  combat.command.bypass:
    description: Allows using all commands while in combat.
    default: op
  modificationffa.sword.ability:
    description: Allows activating Modification sword abilities.
    default: true
  modificationffa.sword.give:
    description: Allows giving Modification swords to players.
    default: op
  modificationffa.pet.spawn:
    description: Allows spawning every ModificationFFA pet.
    default: op
    children:
      modificationffa.pet.spawn.rabbit: true
      modificationffa.pet.spawn.frog: true
      modificationffa.pet.spawn.cat: true
      modificationffa.pet.spawn.wolf: true
  modificationffa.pet.spawn.rabbit:
    description: Allows spawning a rabbit pet.
    default: false
  modificationffa.pet.spawn.frog:
    description: Allows spawning a frog pet.
    default: false
  modificationffa.pet.spawn.cat:
    description: Allows spawning a cat pet.
    default: false
  modificationffa.pet.spawn.wolf:
    description: Allows spawning a wolf pet.
    default: false
  modificationffa.pet.list:
    description: Allows listing all available pets.
    default: op
  modificationffa.arena.admin:
    description: Allows creating and configuring gameplay arenas.
    default: op
  modificationffa.protectarena.admin:
    description: Allows creating protected arenas and exemptions.
    default: op
  modificationffa.stats.view-hidden:
    description: Allows viewing players who hide their stats.
    default: op
  modificationffa.gui.settings.broadcast:
    description: Allows toggling broadcast titles.
    default: true
  modificationffa.gui.settings.connection-messages:
    description: Allows toggling connection messages.
    default: true
  modificationffa.gui.settings.message-sound:
    description: Allows toggling private-message sounds.
    default: true
  modificationffa.gui.settings.protection:
    description: Allows toggling Protection Axe shift-click activation.
    default: true
  modificationffa.gui.settings.explosion:
    description: Allows toggling Explosion Axe shift-click activation.
    default: true
  modificationffa.gui.settings.hide-stats:
    description: Allows hiding personal stats from other players.
    default: true
  modificationffa.gui.settings.kit-safety:
    description: Allows toggling purchased-item protection when loading kits.
    default: true
  modificationffa.gui.settings.invisibility:
    description: Allows toggling whether invisibility effects apply.
    default: true
  modificationffa.gui.settings.executioner-token:
    description: Allows receiving kill tokens from Executioner Sword procs.
    default: true
  modificationffa.gui.settings.anti-ghost-water:
    description: Allows toggling anti-ghost-water inventory resyncs.
    default: true
  modificationffa.gui.settings.personal-time:
    description: Allows using exclusive personal-time settings.
    default: false
  modificationffa.gui.settings.personal-weather:
    description: Allows using exclusive personal-weather settings.
    default: false
  modificationffa.gui.settings.staff:
    description: Allows opening staff settings when implemented.
    default: op
