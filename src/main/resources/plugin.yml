name: ModificationFFA
description: A free-for-all plugin.
version: '${version}'

main: me.poggercity.modificationFFA.ModificationFFA
api-version: '1.21.11'
load: POSTWORLD
loadbefore: [PlayerKits2]

authors: [PoggerCity]

commands:
  modification:
    description: Shows information about ModificationFFA.
    usage: /modification
    aliases: [modificationffa]
  discord:
    description: Shows the server Discord link.
    usage: /discord
  store:
    description: Shows the server store link.
    usage: /store
  kit:
    description: Loads and manages your ModificationFFA kit layout.
    usage: /kit help

permissions:
  modificationffa.reload:
    description: Allows reloading ModificationFFA's configuration.
    default: op
  modificationffa.cooldown.bypass:
    description: Bypasses the shared /discord and /store cooldown.
    default: op
  modificationffa.kit.admin:
    description: Allows saving the authoritative main kit.
    default: op
