# Link settings used by /discord, /store, and the automatic reminders.
links:
  discord: "https://discord.gg/modify"
  store: "https://modifying.tebex.io/"

# Shared per-player cooldown between /discord and /store.
commands:
  cooldown-seconds: 3

reminders:
  enabled: true

  # One reminder is sent at each interval. Discord and store alternate, so they
  # stay five minutes apart and each individual reminder repeats every 10 minutes.
  spacing-minutes: 5
  first: "discord"

  sound:
    enabled: false
    key: "minecraft:block.note_block.pling"
    category: "MASTER"
    volume: 1.0
    pitch: 1.0
